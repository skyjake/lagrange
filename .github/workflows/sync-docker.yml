name: Lagrange Sync Docker image

on:
  push:
    tags:
      - 'sync-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lgrsyncd

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the_Foundation
        run: git submodule update --init --depth 1 lib/the_Foundation

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#sync-v}"
          ver=$(sed -nE 's/^ *VERSION +([0-9.]+).*/\1/p' sync/CMakeLists.txt | head -n1)
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sync/CMakeLists.txt version $ver"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=match,pattern=sync-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=sync-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=sync-v(\d+)\.\d+\.\d+,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=lgrsyncd
            org.opencontainers.image.description=Lagrange Sync server
          annotations: |
            org.opencontainers.image.description=Lagrange Sync server

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sync/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
